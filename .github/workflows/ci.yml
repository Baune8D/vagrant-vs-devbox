name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: Invoke-ScriptAnalyzer -Path . -Recurse -EnableExit
        shell: pwsh
      - name: Install Vagrant
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant
      - run: vagrant plugin install vagrant-hostmanager
      # No provider is installed on the runner, so only the provider-independent settings are validated
      - run: vagrant validate --ignore-provider
